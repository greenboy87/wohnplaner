<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wohnplaner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f2a44'/><path d='M6 26V12l10-6 10 6v14H19v-8h-6v8z' fill='%23f3c76a'/></svg>">
<link rel="stylesheet" href="style.css?v=4">
<style id="svg-stil">
  .lbl { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; pointer-events: none; }
  .lbl.halo { stroke: rgba(255,255,255,.9); stroke-width: 3px; paint-order: stroke; fill: rgba(255,255,255,.9); stroke-linejoin: round; }
  .fett { font-weight: 650; }
</style>
</head>
<body>
<header class="leiste">
  <button id="b-bib" class="nur-mobil" title="Möbel">☰ Möbel</button>
  <div class="marke">Wohnplaner</div>
  <div class="gruppe">
    <select id="setup" title="Variante wählen"></select>
    <button id="b-setup" title="Varianten verwalten">Varianten…</button>
  </div>
  <div class="gruppe">
    <button id="b-undo" title="Rückgängig (⌘Z)">↶</button>
    <button id="b-redo" title="Wiederholen (⇧⌘Z)">↷</button>
  </div>
  <div class="gruppe ansicht">
    <button data-ansicht="masse" title="Wandmaße: aus / Raummaße / Detail mit Türen und Fenstern">Raummaße</button>
    <button data-ansicht="namen">Räume</button>
    <button data-ansicht="moebelmasse">Möbelmaße</button>
    <button data-ansicht="abstaende" title="Abstand des gewählten Möbels zu den Wänden">Abstände</button>
    <button data-ansicht="zonen" title="Freiflächen vor Möbeln (grün = frei, orange = zugestellt)">Freiflächen</button>
    <button data-ansicht="tueren" title="Türschwenk">Türen</button>
    <button data-ansicht="warnungen" title="Rot markieren, wenn Möbel sich überlappen oder in der Wand stehen">Prüfen</button>
    <button data-ansicht="raster" title="Raster 50 cm">Raster</button>
    <button data-ansicht="magnet" title="An Wänden und Möbeln einrasten (Alt beim Ziehen = frei)">Magnet</button>
  </div>
  <div class="gruppe rechts">
    <button id="b-liste" title="Übersicht mit Maßen, Preisen und Links">Liste</button>
    <button id="b-export" title="Plan als PNG speichern">PNG</button>
    <button id="b-hilfe" title="Hilfe">?</button>
    <button id="b-cloud" class="cloud aus">☁︎ …</button>
  </div>
</header>

<aside id="bib">
  <div class="bib-kopf">
    <input id="suche" type="search" placeholder="Möbel suchen …">
    <div class="knoepfe klein">
      <button id="b-bild" title="Foto, Screenshot oder Maßzeichnung einfügen">🖼 Bild</button>
      <button id="b-mass" title="Maßband (M)">📏 Messen</button>
      <button id="b-eigenes" title="Eigenes Möbel mit Maßen">＋ Eigenes</button>
    </div>
    <p class="hinweis">Tipp: Screenshot mit <b>⌘V</b> einfügen oder Bilder in den Plan ziehen.</p>
  </div>
  <div id="bib-liste"></div>
  <input id="datei" type="file" accept="image/*" multiple hidden>
</aside>

<main id="buehne">
  <svg id="plan" xmlns="http://www.w3.org/2000/svg"><g id="welt"></g></svg>
  <div class="zoom">
    <button id="b-plus" title="Hineinzoomen">＋</button>
    <button id="b-minus" title="Herauszoomen">－</button>
    <button id="b-fit" title="Alles zeigen (0)">⤢</button>
  </div>
  <div id="warnung" hidden></div>
  <div id="meldung" hidden></div>
</main>

<aside id="inspektor"></aside>
<div id="dlg" hidden></div>

<template id="hilfe-vorlage">
  <h3>So funktioniert der Wohnplaner</h3>
  <div class="hilfe">
    <p>Der Grundriss ist maßstabsgetreu (Innenmaße aus dem Maß-PDF, etwa ±5 cm). Alles, was du einfügst, hat echte Zentimeter.</p>
    <ol>
      <li><b>Möbel einfügen:</b> links eine Vorlage antippen. Sie erscheint in der Mitte der Ansicht.</li>
      <li><b>Bewegen:</b> ziehen. Mit <i>Magnet</i> rastet es an Wänden und anderen Möbeln ein (Alt-Taste = frei). Pfeiltasten verschieben um 1 cm, mit ⇧ um 10 cm.</li>
      <li><b>Drehen:</b> blauen Kreis ziehen (rastet in 15°-Schritten, ⇧ = frei) oder Taste <b>R</b> für 90°.</li>
      <li><b>Größe:</b> weißes Quadrat an der Ecke ziehen oder rechts die Zentimeter eintragen.</li>
      <li><b>Abstände:</b> Beim gewählten Möbel siehst du blau den Abstand zu jeder Wand.</li>
      <li><b>Freiflächen:</b> Der grüne Bereich vor Möbeln ist der Platz zum Benutzen (Schranktür auf, ans Bett treten, am Schreibtisch sitzen). Orange = da steht etwas im Weg. Richtwerte: Durchgang 60–70 cm, vor Schränken 70–90 cm, neben dem Bett 60 cm, hinter dem Schreibtischstuhl 100 cm.</li>
      <li><b>Rot gestrichelt</b> = Möbel überlappen sich oder stehen in der Wand.</li>
      <li><b>Bilder:</b> Produktfoto oder Screenshot einer Shopseite mit ⌘V einfügen, rechts die echte Breite eintragen, dann Deckkraft verringern – so siehst du, wie es wirkt. Links aus der Adresszeile mit ⌘V werden zur Notiz mit Link.</li>
      <li><b>Raumfarben:</b> In einen leeren Bereich eines Raums tippen → Boden- und Wandfarbe wählen.</li>
      <li><b>Maßband:</b> Taste <b>M</b>, dann von Punkt zu Punkt ziehen.</li>
      <li><b>Varianten:</b> Oben verschiedene Einrichtungen anlegen und kopieren, um Ideen zu vergleichen.</li>
      <li><b>Eigene Vorlage:</b> Ein angepasstes Möbel mit „Als Vorlage merken“ unter „Meine Möbel“ speichern.</li>
      <li><b>Alle Geräte:</b> Oben rechts mit Google anmelden. Danach wird alles automatisch gespeichert und ist auf jedem Gerät da.</li>
    </ol>
  </div>
  <div class="knoepfe"><button data-zu class="primaer">Los geht's</button></div>
</template>

<script src="js/grundriss.js?v=4"></script>
<script src="js/vorlagen.js?v=4"></script>
<script src="js/app.js?v=4"></script>
<script type="module" src="js/cloud.js?v=4"></script>
</body>
</html>
